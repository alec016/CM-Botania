plugins {
  id 'architectury-plugin' version '3.4-SNAPSHOT'
  id 'dev.architectury.loom' version '1.7-SNAPSHOT' apply false
  id "io.github.p03w.machete" version "1.+" // automatic jar compressing on build
  id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
  id "me.shedaniel.unified-publishing" version "0.1.+" apply false
  id 'com.diffplug.spotless' version '5.12.5' apply false
}

architectury {
  minecraft = project.minecraft_version
}

subprojects {
  apply plugin: 'dev.architectury.loom'
  apply plugin: "com.diffplug.spotless"

  loom {
    silentMojangMappingsLicense()
  }

  repositories {
    mavenCentral()
    maven { url = "https://maven.shedaniel.me/" } // Cloth Config, REI
    maven { url = "https://dvs1.progwml6.com/files/maven/" } // JEI
    maven { url = "https://maven.parchmentmc.org" } // Parchment mappings
    maven { url = "https://maven.quiltmc.org/repository/release" } // Quilt Mappings
    maven {
      name = 'BlameJared Maven'
      url = 'https://maven.blamejared.com'
    }
    mavenLocal()
  }

  dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"

    mappings loom.layered() {
      officialMojangMappings()
      parchment("org.parchmentmc.data:parchment-${project.minecraft_version}:${project.parchment_version}@zip")
    }
  }
}

allprojects {
  apply plugin: 'java'
  apply plugin: 'architectury-plugin'
  apply plugin: 'maven-publish'
  group = rootProject.maven_group
  version = rootProject.mod_version

  // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
  archivesBaseName = "$rootProject.archives_name-$project.name"

  repositories {
    maven {
      name = "Custom Machinery maven"
      url = "https://maven.frinn.fr/repository/maven/"
      content {
        includeGroup "frinn.custommachinery"
      }
    }
    maven {
      name = "Latvian maven"
      url = "https://maven.saps.dev/minecraft"
      content {
        includeGroup "dev.latvian.mods"
        includeGroup "dev.ftb.mods"
      }
    }
    maven {
      name = "ldtteam Maven"
      url = "https://ldtteam.jfrog.io/ldtteam/modding/"
      content {
        includeGroup "com.communi-suggestu.saecularia-caudices"
      }
    }
    maven {
      name = "C4"
      url = "https://maven.theillusivec4.top/"
    }
    maven {
      name = "Unascribed"
      url "https://repo.unascribed.com" // for ears
      content {
        includeGroup "com.unascribed"
      }
    }
  }

  tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    options.release = 17
  }

  java {
    sourceCompatibility = targetCompatibility = '17'
    withSourcesJar()
  }

  if(project.path != ':') {
    publishing {
      publications {
        maven(MavenPublication) {
          groupId = project.group
          artifactId = project.archivesBaseName
          version = project.version
          from components.java

          pom {
            name = project.mod_name
            description = project.mod_description
            packaging = 'jar'
            version = project.version
            scm {
              url = project.github
            }
            issueManagement {
              system = 'github'
              url = project.issues
            }
            licenses {
              license {
                name = project.license
                distribution = 'repo'
              }
            }
            developers {
              developer {
                id = project.author
                name = project.author
                roles = ['developper']
              }
            }
          }
        }
      }
      repositories {
        maven {
          name = 'maven'
          url = 'https://maven.frinn.fr/repository/maven/'
          credentials {
            username = 'frinn'
            password = System.getenv('MAVEN_PASSWORD')
          }
        }
      }
    }
  }
}

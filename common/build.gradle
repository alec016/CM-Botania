architectury {
  common(rootProject.enabled_platforms.split(","))
}

repositories {
  // mavens for Create Fabric and dependencies
  maven { url = "https://api.modrinth.com/maven" } // LazyDFU
  maven { url = "https://maven.terraformersmc.com/releases/" } // Mod Menu
  maven { url = "https://mvn.devos.one/snapshots/" } // Create Fabric, Porting Lib, Forge Tags, Milk Lib, Registrate Fabric
  maven { url = "https://cursemaven.com" } // Forge Config API Port
  maven { url = "https://maven.cafeteria.dev/releases" } // Fake Player API
  maven { url = "https://maven.jamieswhiteshirt.com/libs-release" } // Reach Entity Attributes
  maven { url = "https://jitpack.io/" } // Mixin Extras, Fabric ASM
  maven {
    name = 'BlameJared Maven'
    url = 'https://maven.blamejared.com'
  }
  maven {
    name = "C4"
    url = "https://maven.theillusivec4.top/"
  }
  maven {
    name = "Unascribed"
    url "https://repo.unascribed.com" // for ears
    content {
      includeGroup "com.unascribed"
    }
  }
  maven {
    name "entity reach"
    url "https://maven.jamieswhiteshirt.com/libs-release/"
  }
}

dependencies {
  // We depend on Fabric Loader here to use the Fabric @Environment annotations,
  // which get remapped to the correct annotations on each platform.
  // Do NOT use other classes from Fabric Loader.
  modImplementation("net.fabricmc:fabric-loader:${project.fabric_loader_version}")
  modApi("dev.architectury:architectury:${project.architectury_api_version}")

  // JEI
  modCompileOnly("mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}")

  // Botania
  modImplementation "curse.maven:botania-fabric-421839:5594996"
  modApi "vazkii.botania:Botania:${project.botania_version}-FORGE:api"

  // Custom Machinery
  modImplementation "frinn.custommachinery:CustomMachinery-api:${project.minecraft_version}-${project.cm_version}"
  modImplementation "frinn.custommachinery:CustomMachinery-common:${project.minecraft_version}-${project.cm_version}"

  //KubeJS common module
  modLocalRuntime modCompileOnly("dev.latvian.mods:kubejs:${project.kubejs_version}")

  //Crafttweaker common module
  modLocalRuntime modCompileOnly("com.blamejared.crafttweaker:CraftTweaker-common-${project.minecraft_version}:${project.ct_version}")
}
